#:schema node_modules/wrangler/config-schema.json
name = "face-detector"
compatibility_date = "2024-01-01"

[vars]
# 环境变量配置（如果需要）

[[routes]]
pattern = "face-detector.pages.dev/*"
zone_name = "pages.dev"

[build]
# 无需构建命令，因为这是静态网站
command = ""
cwd = ""
watch_dir = ""

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
